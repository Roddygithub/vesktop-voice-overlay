[package]
name = "vesktop-voice-overlay"
version = "0.1.0"
edition = "2021"
description = "Wayland-native voice activity overlay for Vesktop"
license = "GPL-3.0-only"
repository = "https://github.com/Roddygithub/vesktop-voice-overlay"
authors = ["Roddy"]
categories = ["gui", "wayland", "discord"]
keywords = ["gtk4", "layer-shell", "voice", "overlay", "vesktop"]

[dependencies]
gtk4 = "0.11"
libadwaita = "0.9"
gio = "0.20"
glib = "0.20"
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros", "signal"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.24"
dirs = "5.0"
toml = "0.8"
once_cell = "1.19"
gtk4-layer-shell = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
graphene-rs = "0.22"
cairo-rs = "0.18"
gdk4 = "0.11"
gdk4-wayland = "0.11"
gdk-pixbuf = "0.22"
libc = "0.2"
notify = "6.1"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
vergen = { version = "7", features = ["cargo"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
