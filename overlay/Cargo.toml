[package]
name = "vesktop-voice-overlay"
version = "1.2.1"
edition = "2021"
description = "Wayland-native voice activity overlay for Discord Desktop and Vesktop"
license = "GPL-3.0-only"
repository = "https://github.com/Roddygithub/vesktop-voice-overlay"
authors = ["Roddy"]
categories = ["gui", "wayland", "discord"]
keywords = ["gtk4", "layer-shell", "voice", "overlay", "vesktop"]

[dependencies]
gtk4 = "0.11"
glib = "0.22"
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "time", "net"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
dirs = "6.0"
toml = "1.1"
once_cell = "1.19"
gtk4-layer-shell = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
gdk4 = "0.11"
gdk-pixbuf = "0.22"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.release-debug]
inherits = "release"
strip = false
debug = true
