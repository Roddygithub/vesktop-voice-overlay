name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: '1.97'
  NODE_VERSION: '20'
  VENCORD_REV: 'ef29bbeb'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./overlay
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev \
            valac

      - name: Build and install gtk4-layer-shell from source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build overlay
        run: cargo build --locked

      - name: Test overlay
        run: cargo test --locked

      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Lint plugin
        working-directory: ./plugin
        run: npm run lint

      - name: Test plugin
        working-directory: ./plugin
        run: npm test

  vencord-integration:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Clone Vencord (pinned revision)
        run: git clone https://github.com/Vendicated/Vencord.git /tmp/Vencord
        working-directory: /tmp

      - name: Checkout pinned Vencord revision
        run: |
          cd /tmp/Vencord
          git checkout ${{ env.VENCORD_REV }}

      - name: Install plugin into Vencord userplugins
        run: |
          mkdir -p /tmp/Vencord/src/userplugins/vesktopVoiceOverlay
          cp plugin/src/index.ts \
             plugin/src/native.ts \
             plugin/src/protocol.ts \
             plugin/src/voiceState.ts \
             plugin/src/snapshot.ts \
             /tmp/Vencord/src/userplugins/vesktopVoiceOverlay/

      - name: Install Vencord dependencies
        run: pnpm install
        working-directory: /tmp/Vencord

      - name: Build Vencord
        run: pnpm build
        working-directory: /tmp/Vencord

      - name: Verify plugin discovery
        run: |
          grep -q "VesktopVoiceOverlay" /tmp/Vencord/dist/vencordDesktopRenderer.js
          grep -q "VesktopVoiceOverlay" /tmp/Vencord/dist/vencordDesktopMain.js

  build-release:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./overlay
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev \
            valac

      - name: Build and install gtk4-layer-shell from source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Build release overlay
        run: cargo build --release --locked

      - name: Upload overlay binary
        uses: actions/upload-artifact@v4
        with:
          name: vesktop-voice-overlay
          path: overlay/target/release/vesktop-voice-overlay
          retention-days: 7
