name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: '1.97'
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./overlay
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev

      - name: Build and install gtk4-layer-shell from source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build overlay
        run: cargo build --locked

      - name: Test overlay
        run: cargo test --locked

      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Typecheck plugin
        working-directory: ./plugin
        run: npm run typecheck

      - name: Lint plugin
        working-directory: ./plugin
        run: npm run lint

      - name: Test plugin
        working-directory: ./plugin
        run: npm test

      - name: Build plugin
        working-directory: ./plugin
        run: npm run build

  build-release:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./overlay
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev

      - name: Build and install gtk4-layer-shell from source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Build release overlay
        run: cargo build --release --locked

      - name: Upload overlay binary
        uses: actions/upload-artifact@v4
        with:
          name: vesktop-voice-overlay
          path: overlay/target/release/vesktop-voice-overlay
          retention-days: 7

  build-plugin:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Build plugin
        working-directory: ./plugin
        run: npm run build

      - name: Pack plugin
        working-directory: ./plugin
        run: npm pack

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: vesktop-voice-overlay-plugin
          path: plugin/*.tgz
          retention-days: 7
