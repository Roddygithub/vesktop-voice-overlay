name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RUST_VERSION: '1.97'
  NODE_VERSION: '22'
  VENCORD_REV: 'ef29bbeb6119cfb53d1273ed78147bcc97d91261'
  GTK4_LAYER_SHELL_REV: '1c963c51514581c41b9bdae08cdf69171265cdda'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./overlay
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential \
            meson \
            shellcheck \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev \
            xvfb \
            valac

      - name: Build and install gtk4-layer-shell from source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          git checkout "$GTK4_LAYER_SHELL_REV"
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build overlay
        run: cargo build --locked

      - name: Test overlay
        run: xvfb-run -a cargo test --locked

      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Lint plugin
        working-directory: ./plugin
        run: npm run lint

      - name: Test plugin
        working-directory: ./plugin
        run: npm test

      - name: Validate installer
        working-directory: .
        run: |
          bash -n install.sh tests/installer_test.sh
          shellcheck install.sh tests/installer_test.sh
          tests/installer_test.sh

  vencord-integration:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Clone Vencord (pinned revision)
        run: git clone https://github.com/Vendicated/Vencord.git /tmp/Vencord
        working-directory: /tmp

      - name: Checkout pinned Vencord revision
        run: |
          cd /tmp/Vencord
          git checkout ${{ env.VENCORD_REV }}

      - name: Install plugin into Vencord userplugins
        run: |
          mkdir -p /tmp/Vencord/src/userplugins/vesktopVoiceOverlay
          cp plugin/src/index.ts \
             plugin/src/native.ts \
             plugin/src/protocol.ts \
             plugin/src/resendCache.ts \
             plugin/src/voiceState.ts \
             /tmp/Vencord/src/userplugins/vesktopVoiceOverlay/

      - name: Install Vencord dependencies
        run: pnpm install --frozen-lockfile
        working-directory: /tmp/Vencord

      - name: Build Vencord
        run: pnpm build
        working-directory: /tmp/Vencord

      - name: Verify plugin discovery
        run: |
          grep -q "VesktopVoiceOverlay" /tmp/Vencord/dist/vencordDesktopRenderer.js
          grep -q "VesktopVoiceOverlay" /tmp/Vencord/dist/vencordDesktopMain.js

  build-release:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./overlay
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev \
            valac

      - name: Build and install gtk4-layer-shell from source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          git checkout "$GTK4_LAYER_SHELL_REV"
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Build release overlay
        run: cargo build --release --locked

      - name: Upload overlay binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vesktop-voice-overlay
          path: overlay/target/release/vesktop-voice-overlay
          retention-days: 7
