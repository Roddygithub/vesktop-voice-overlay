name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.0)'
        required: false
        type: string

permissions: {}

env:
  RUST_VERSION: '1.97'
  NODE_VERSION: '20'

jobs:
  build-overlay:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            overlay/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            valac
      
      - name: Build and install gtk4-layer-shell from source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
      
      - name: Build release overlay
        run: cargo build --release --locked
      
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Upload overlay binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vesktop-voice-overlay
          path: overlay/target/release/vesktop-voice-overlay
          retention-days: 7

  build-plugin:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json
      
      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci
      
      - name: Pack plugin
        working-directory: ./plugin
        run: npm pack
      
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Upload plugin package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vesktop-voice-overlay-plugin
          path: plugin/*.tgz
          retention-days: 7

  create-release:
    permissions:
      contents: write
    needs: [build-overlay, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1 (v2.3.2)
        with:
          files: |
            artifacts/vesktop-voice-overlay/vesktop-voice-overlay
            artifacts/vesktop-voice-overlay-plugin/*.tgz
          generate_release_notes: true
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-aur:
    needs: create-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: env.AUR_SSH_PRIVATE_KEY != ''
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      
      - name: Download overlay binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vesktop-voice-overlay
          path: artifacts
      
      - name: Calculate source archive SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/Roddygithub/vesktop-voice-overlay/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
      
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Clone or init AUR repo
        run: |
          if git clone ssh://aur@aur.archlinux.org/vesktop-voice-overlay.git /tmp/vesktop-voice-overlay-aur 2>/dev/null; then
            cd /tmp/vesktop-voice-overlay-aur
            git pull
          else
            mkdir -p /tmp/vesktop-voice-overlay-aur
            cd /tmp/vesktop-voice-overlay-aur
            git init
            git remote add origin ssh://aur@aur.archlinux.org/vesktop-voice-overlay.git
          fi
      
      - name: Update PKGBUILD
        run: |
          cd /tmp/vesktop-voice-overlay-aur
          cp ../../../packaging/aur/PKGBUILD .
          cp ../../../packaging/aur/vesktop-voice-overlay.install .
          sed -i "s/pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('${{ steps.sha256.outputs.sha256 }}')/" PKGBUILD
          makepkg --printsrcinfo > .SRCINFO
      
      - name: Commit and push AUR
        run: |
          cd /tmp/vesktop-voice-overlay-aur
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "chore: update AUR to ${{ steps.version.outputs.version }}"
          git push
      
      - name: Clean up
        run: rm -rf /tmp/vesktop-voice-overlay-aur ~/.ssh/id_ed25519

    permissions:
      contents: read
  update-aur-skip:
    needs: create-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: env.AUR_SSH_PRIVATE_KEY == ''
    steps:
      - name: Skip AUR update (no SSH key)
        run: |
          echo "AUR_SSH_PRIVATE_KEY not set — skipping AUR publication"
          echo "To enable AUR publishing: add AUR_SSH_PRIVATE_KEY secret and push a tag"

