name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  RUST_VERSION: '1.97'
  NODE_VERSION: '20'

jobs:
  build-overlay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./overlay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            overlay/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential
      
      - name: Build release overlay
        run: cargo build --release --locked
      
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Upload overlay binary
        uses: actions/upload-artifact@v4
        with:
          name: vesktop-voice-overlay
          path: overlay/target/release/vesktop-voice-overlay
          retention-days: 7

  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json
      
      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci
      
      - name: Build plugin
        working-directory: ./plugin
        run: npm run build
      
      - name: Pack plugin
        working-directory: ./plugin
        run: npm pack
      
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: vesktop-voice-overlay-plugin
          path: plugin/*.tgz
          retention-days: 7

  create-release:
    needs: [build-overlay, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/vesktop-voice-overlay/vesktop-voice-overlay
            artifacts/vesktop-voice-overlay-plugin/*.tgz
          generate_release_notes: true
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-aur:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUR_PUSH_TOKEN }}
          fetch-depth: 0
      
      - name: Download overlay binary
        uses: actions/download-artifact@v4
        with:
          name: vesktop-voice-overlay
          path: artifacts
      
      - name: Calculate SHA256
        id: sha256
        run: echo "sha256=$(sha256sum artifacts/vesktop-voice-overlay | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Update PKGBUILD
        run: |
          cd packaging/aur
          sed -i "s/pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('${{ steps.sha256.outputs.sha256 }}')/" PKGBUILD
          makepkg --printsrcinfo > .SRCINFO
      
      - name: Commit and push AUR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          git commit -m "chore: update AUR to ${{ steps.version.outputs.version }}"
          git push
