name: Release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  RUST_VERSION: '1.97'
  NODE_VERSION: '22'
  VENCORD_REV: 'ef29bbeb6119cfb53d1273ed78147bcc97d91261'
  GTK4_LAYER_SHELL_REV: '1c963c51514581c41b9bdae08cdf69171265cdda'

jobs:
  build-overlay:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./overlay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            overlay/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            build-essential \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            xvfb \
            valac
      
      - name: Build and install gtk4-layer-shell from source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          git checkout "$GTK4_LAYER_SHELL_REV"
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
      
      - name: Verify tag matches overlay version
        run: |
          PACKAGE_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$PACKAGE_VERSION" = "${GITHUB_REF_NAME#v}"

      - name: Validate overlay
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          xvfb-run -a cargo test --locked

      - name: Build release overlay
        run: cargo build --release --locked
      
      - name: Upload overlay binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vesktop-voice-overlay
          path: overlay/target/release/vesktop-voice-overlay
          retention-days: 7

  build-plugin:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json
      
      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Verify tag matches plugin version
        working-directory: ./plugin
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

      - name: Validate plugin
        working-directory: ./plugin
        run: |
          npm run lint
          npm test
          npm audit

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Build in pinned Vencord
        run: |
          git clone https://github.com/Vendicated/Vencord.git /tmp/Vencord
          git -C /tmp/Vencord checkout "$VENCORD_REV"
          mkdir -p /tmp/Vencord/src/userplugins/vesktopVoiceOverlay
          cp plugin/src/index.ts \
             plugin/src/native.ts \
             plugin/src/protocol.ts \
             plugin/src/resendCache.ts \
             plugin/src/voiceState.ts \
             /tmp/Vencord/src/userplugins/vesktopVoiceOverlay/
          cd /tmp/Vencord
          pnpm install --frozen-lockfile
          pnpm build
          grep -q "VesktopVoiceOverlay" dist/vencordDesktopRenderer.js
          grep -q "VesktopVoiceOverlay" dist/vencordDesktopMain.js

      - name: Pack plugin source
        working-directory: ./plugin
        run: npm pack
      
      - name: Upload plugin package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vesktop-voice-overlay-plugin
          path: plugin/*.tgz
          retention-days: 7

  create-release:
    permissions:
      contents: write
    needs: [build-overlay, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate artifact checksums
        run: |
          cd artifacts
          sha256sum \
            vesktop-voice-overlay \
            vesktop-voice-overlay-plugin-*.tgz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1 (v2.3.2)
        with:
          files: |
            artifacts/vesktop-voice-overlay
            artifacts/vesktop-voice-overlay-plugin-*.tgz
            artifacts/SHA256SUMS
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-aur:
    needs: create-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install publication tools
        run: pacman -Syu --needed --noconfirm git openssh
        if: env.AUR_SSH_PRIVATE_KEY != ''

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
        if: env.AUR_SSH_PRIVATE_KEY != ''
      
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        if: env.AUR_SSH_PRIVATE_KEY != ''
      
      - name: Calculate source archive SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/Roddygithub/discord-voice-overlay/archive/refs/tags/v${VERSION}.tar.gz"
          ARCHIVE="/tmp/vesktop-voice-overlay-${VERSION}.tar.gz"
          curl -fsSL "$URL" -o "$ARCHIVE"
          SHA256=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
        if: env.AUR_SSH_PRIVATE_KEY != ''
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if: env.AUR_SSH_PRIVATE_KEY != ''
      
      - name: Clone AUR repo
        run: |
          git -c init.defaultBranch=master clone \
            ssh://aur@aur.archlinux.org/vesktop-voice-overlay.git \
            /tmp/vesktop-voice-overlay-aur
        if: env.AUR_SSH_PRIVATE_KEY != ''
      
      - name: Update PKGBUILD
        run: |
          cd /tmp/vesktop-voice-overlay-aur
          cp "$GITHUB_WORKSPACE/packaging/aur/PKGBUILD" .
          cp "$GITHUB_WORKSPACE/packaging/aur/vesktop-voice-overlay.install" .
          cp "$GITHUB_WORKSPACE/packaging/aur/LICENSE" .
          sed -i "s/pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('${{ steps.sha256.outputs.sha256 }}')/" PKGBUILD
          runuser -u nobody -- makepkg --printsrcinfo > .SRCINFO
        if: env.AUR_SSH_PRIVATE_KEY != ''
      
      - name: Commit and push AUR
        run: |
          cd /tmp/vesktop-voice-overlay-aur
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO vesktop-voice-overlay.install LICENSE
          git commit -m "chore: update AUR to ${{ steps.version.outputs.version }}"
          git push origin HEAD:master
        if: env.AUR_SSH_PRIVATE_KEY != ''
      
      - name: Clean up
        run: rm -rf /tmp/vesktop-voice-overlay-aur /tmp/vesktop-voice-overlay-*.tar.gz ~/.ssh/id_ed25519
        if: env.AUR_SSH_PRIVATE_KEY != ''
      
      - name: Skip AUR update (no SSH key)
        run: |
          echo "AUR_SSH_PRIVATE_KEY not set — skipping AUR publication"
          echo "To enable AUR publishing: add AUR_SSH_PRIVATE_KEY secret and push a tag"
        if: env.AUR_SSH_PRIVATE_KEY == ''
